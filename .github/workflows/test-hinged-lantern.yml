name: Test Hinged Lantern
on:
  pull_request:
    paths:
      - 'dist/experiments/hinged-lantern/**'
      - 'dist/shared/**'
      - '.github/workflows/test-hinged-lantern.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Geometry and shared regression tests
        run: node --test $(find dist -name '*.test.mjs' -print) .github/tests/*.test.mjs
      - name: Browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/hinged-lantern-qa" --no-save playwright@1.62.1
          "$RUNNER_TEMP/hinged-lantern-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Controls and complete deterministic video cycle
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/hinged-lantern-qa/node_modules/playwright
        run: node dist/experiments/hinged-lantern/tests/browser.cjs
      - name: Preserve visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hinged-lantern-validation
          path: /tmp/hinged-lantern*.png
          retention-days: 14
