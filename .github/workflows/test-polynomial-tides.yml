name: Test Polynomial Tides

on:
  pull_request:
    paths:
      - 'dist/experiments/polynomial-tides/**'
      - 'dist/shared/frame-export*.mjs'
      - '.github/workflows/test-polynomial-tides.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numerical:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check map coefficients, boundedness, discovery filters, and export timing
        run: node --test dist/experiments/polynomial-tides/core.test.mjs dist/shared/frame-export.test.mjs
