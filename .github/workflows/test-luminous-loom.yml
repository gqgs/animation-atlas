name: Test Luminous Loom
on:
  pull_request:
    paths:
      - 'dist/experiments/luminous-loom/**'
      - 'dist/shared/**'
      - 'dist/experiments.json'
      - 'dist/app.js'
      - '.github/workflows/test-luminous-loom.yml'
      - '.github/scripts/package-luminous-loom.py'
      - 'dist/downloads/luminous-loom-source.zip'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test geometry, drawing and shared export contracts
        run: |
          node --test $(find dist -name '*.test.mjs' -print) .github/tests/*.test.mjs
          python3 .github/scripts/package-luminous-loom.py --check
      - name: Install isolated browser QA tools
        id: browser_tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm install --prefix "$RUNNER_TEMP/loom-qa" --no-save playwright@1.62.1
          "$RUNNER_TEMP/loom-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify drawing pixels, controls, benchmark and actual exports
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/loom-qa/node_modules/playwright
          QA_OUTPUT: ${{ runner.temp }}/loom-qa-output
        run: node dist/experiments/luminous-loom/tests/browser-test.cjs
      - name: Verify cyclic controls and real tracked video export
        if: ${{ !cancelled() && steps.browser_tools.outcome == 'success' }}
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/loom-qa/node_modules/playwright
          QA_OUTPUT: ${{ runner.temp }}/loom-qa-output/parameter-tracks
        run: node dist/experiments/luminous-loom/tests/parameter-tracks-browser.cjs
      - name: Preserve measurements and visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luminous-loom-validation
          path: ${{ runner.temp }}/loom-qa-output
          if-no-files-found: warn
