name: Test Eversion Bloom
on:
  pull_request:
    paths:
      - 'dist/experiments/eversion-bloom/**'
      - 'dist/shared/**'
      - '.github/workflows/test-eversion-bloom.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Geometry and shared regression tests
        run: node --test $(find dist -name '*.test.mjs' -print) .github/tests/*.test.mjs
      - name: Browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/eversion-bloom-qa" --no-save playwright@1.62.1
          "$RUNNER_TEMP/eversion-bloom-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Controls and complete deterministic video cycle
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/eversion-bloom-qa/node_modules/playwright
        run: node dist/experiments/eversion-bloom/tests/browser.cjs
      - name: Preserve visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eversion-bloom-validation
          path: /tmp/eversion-bloom*.png
          retention-days: 14

  recording:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        size: [1080, 2160]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Browser and decode tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install pillow numpy
          npm install --prefix "$RUNNER_TEMP/qa" --no-save playwright@1.62.1
          "$RUNNER_TEMP/qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Compare raw and repeated full-cycle exports
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/qa/node_modules/playwright
          QA_OUTPUT: ${{ runner.temp }}/eversion-evidence
          QA_SIZE: ${{ matrix.size }}
        run: |
          node dist/experiments/eversion-bloom/tests/recording.cjs
          python dist/experiments/eversion-bloom/tests/compare-recording.py "$RUNNER_TEMP/eversion-evidence"
      - name: Preserve image and numerical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eversion-recording-${{ matrix.size }}
          path: |
            ${{ runner.temp }}/eversion-evidence/*.json
            ${{ runner.temp }}/eversion-evidence/*.png
            ${{ runner.temp }}/eversion-evidence/*.jpg
          retention-days: 7
